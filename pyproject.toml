[project]
name = "saos-appeals"
version = "0.1.0"
description = "Predicting appeal outcomes in Polish labour and social-insurance cases from SAOS court judgments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "tqdm>=4.66",
]

[project.scripts]
saos-download = "saos_appeals.data.download:main"
saos-extract = "saos_appeals.data.extract:main"
saos-judgments = "saos_appeals.data.judgments:main"
saos-pair = "saos_appeals.data.pairs:main"
saos-label = "saos_appeals.data.labels:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saos_appeals"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["data", "results"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]
